on:
  push:
    paths:
      - one.k8ie.Voucher.json
      - src/**
      - data/**
      - flatpak-deps/**
      - po/**
      - .github/workflows/flatpak.yml
  pull_request:
    paths:
      - one.k8ie.Voucher.json
      - src/**
      - data/**
      - flatpak-deps/**
      - po/**
      - .github/workflows/flatpak.yml
  workflow_dispatch:
name: Flatpak - dev
jobs:
  flatpak:
    name: "Flatpak"
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
      # Don't fail the whole workflow if one architecture fails
      fail-fast: false
    steps:
    - uses: actions/checkout@v4
    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: voucher.flatpak
        manifest-path: one.k8ie.Voucher.json
        cache-key: flatpak-builder-${{ github.sha }}
        arch: ${{ matrix.arch }}
